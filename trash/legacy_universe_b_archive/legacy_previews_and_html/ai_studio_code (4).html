<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIVERSE B // Master Canon Codex & Living Story Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-void: #04060d;
  --bg-primary: #070b16;
  --bg-secondary: rgba(11, 17, 32, 0.86);
  --bg-card: rgba(16, 24, 45, 0.72);
  --bg-card-solid: #0f172a;
  --bg-card-hover: rgba(24, 36, 66, 0.9);
  --text-main: #f8fafc;
  --text-Prose: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --accent-gold: #f59e0b;
  --accent-gold-light: #fbbf24;
  --accent-gold-glow: rgba(245, 158, 11, 0.25);
  --accent-cyan: #06b6d4;
  --accent-cyan-light: #38bdf8;
  --accent-emerald: #10b981;
  --accent-rose: #f43f5e;
  --accent-purple: #a855f7;
  --border-color: rgba(148, 163, 184, 0.14);
  --border-gold: rgba(245, 158, 11, 0.42);
  --border-cyan: rgba(6, 182, 212, 0.42);
  --font-display: 'Cinzel', Georgia, serif;
  --font-sans: 'Plus Jakarta Sans', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-void);
  background-image: 
    radial-gradient(circle at 10% 12%, rgba(245, 158, 11, 0.09) 0%, transparent 35%),
    radial-gradient(circle at 90% 85%, rgba(6, 182, 212, 0.09) 0%, transparent 40%),
    radial-gradient(circle at 50% 45%, rgba(168, 85, 247, 0.04) 0%, transparent 55%),
    linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
  color: var(--text-main);
  font-family: var(--font-sans);
  line-height: 1.72;
  display: flex;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

/* High-End Matte Grain Texture Overlay */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
}

/* Reading Progress Bar */
#readingProgress {
  position: absolute;
  top: 64px;
  left: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-cyan-light), var(--accent-purple));
  z-index: 30;
  transition: width 0.1s ease-out;
  box-shadow: 0 0 12px var(--accent-gold);
}

/* Sidebar Upgrade */
#sidebar {
  width: 340px;
  background: var(--bg-secondary);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 20;
  box-shadow: 12px 0 40px rgba(0, 0, 0, 0.6);
}

.brand-header {
  padding: 22px 22px 20px;
  border-bottom: 1px solid var(--border-color);
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(6, 182, 212, 0.05) 100%);
  position: relative;
  overflow: hidden;
}

.brand-header::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-gold), var(--accent-cyan), transparent);
}

.brand-title {
  font-family: var(--font-display);
  font-size: 1.24rem;
  font-weight: 900;
  background: linear-gradient(90deg, #fff 0%, var(--accent-gold-light) 55%, var(--accent-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1.2px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-subtitle {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--accent-cyan-light);
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 600;
}

.search-box {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-color);
  background: rgba(4, 6, 13, 0.4);
}

.search-input {
  width: 100%;
  padding: 11px 34px 11px 14px;
  background: rgba(4, 6, 13, 0.85);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 0.84rem;
  outline: none;
  transition: all 0.22s ease;
}

.search-input:focus {
  border-color: var(--accent-gold);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
}

.nav-menu {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px 24px;
}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  margin-bottom: 6px;
  border-radius: 10px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid transparent;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  transform: translateX(3px);
  border-color: rgba(255, 255, 255, 0.09);
}

.nav-item.active {
  background: linear-gradient(90deg, rgba(245, 158, 11, 0.2) 0%, rgba(6, 182, 212, 0.06) 100%);
  color: var(--accent-gold-light);
  border: 1px solid var(--border-gold);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 3px 0 0 var(--accent-gold);
}

.nav-item-title {
  display: flex;
  align-items: center;
  gap: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-count {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 2px 8px;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  color: var(--text-muted);
}

.nav-item.active .file-count {
  background: var(--accent-gold);
  color: #050811;
  font-weight: 700;
  border-color: transparent;
}

/* Search Group Styles (Fixed from original) */
.search-group {
  margin-bottom: 14px;
  background: rgba(9, 13, 26, 0.6);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  overflow: hidden;
}
.search-cat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: rgba(245, 158, 11, 0.1);
  border-bottom: 1px solid var(--border-color);
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--accent-gold-light);
}
.search-result-item {
  padding: 9px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.15s;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: rgba(6, 182, 212, 0.1); }
.search-result-item.active { background: rgba(245, 158, 11, 0.18); border-left: 3px solid var(--accent-gold); }
.search-doc-title { font-size: 0.82rem; color: var(--text-main); font-weight: 600; }
.search-doc-meta { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }

/* Main Area & Top Bar */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.top-bar {
  height: 64px;
  background: rgba(7, 11, 22, 0.88);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  z-index: 10;
  flex-shrink: 0;
}

.breadcrumbs {
  font-size: 0.82rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
}

.breadcrumbs span.current {
  color: var(--accent-gold-light);
  font-weight: 700;
  background: rgba(245, 158, 11, 0.12);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.status-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.status-badge {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  padding: 5px 11px;
  border-radius: 20px;
  background: rgba(16, 185, 129, 0.12);
  color: var(--accent-emerald);
  border: 1px solid rgba(16, 185, 129, 0.3);
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.2s;
}
.status-badge:hover { transform: translateY(-1px); }

.content-viewport {
  flex: 1;
  overflow-y: auto;
  padding: 28px 38px 90px;
  scroll-behavior: smooth;
}

/* Data Merger Banner (When DATA is not yet injected) */
.data-sync-banner {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.18) 0%, rgba(15, 23, 42, 0.95) 60%, rgba(6, 182, 212, 0.15) 100%);
  border: 1px solid var(--accent-gold);
  border-radius: 14px;
  padding: 16px 22px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
}
.data-sync-info h4 {
  font-family: var(--font-display);
  color: var(--accent-gold-light);
  font-size: 0.98rem;
  margin-bottom: 3px;
}
.data-sync-info p {
  font-size: 0.82rem;
  color: #cbd5e1;
}
.data-sync-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}
.sync-btn {
  padding: 9px 16px;
  border-radius: 8px;
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--accent-gold-light);
  background: linear-gradient(135deg, var(--accent-gold) 0%, #d97706 100%);
  color: #050811;
  transition: all 0.2s;
}
.sync-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4); }
.sync-btn.secondary {
  background: rgba(6, 182, 212, 0.16);
  color: var(--accent-cyan-light);
  border-color: var(--border-cyan);
}

/* =========================================================================
   STORY CHRONICLE & IMMERSIVE NOVEL-GRADE PORTAL STYLES (UPGRADED)
   ========================================================================= */
.story-chronicle-container {
  max-width: 1180px;
  margin: 0 auto;
  padding: 4px 4px 60px 4px;
  animation: chronicleFadeIn 0.35s ease-out;
}

@keyframes chronicleFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Sticky Quick-Jump Bar for Story Chronicle */
.chronicle-jump-bar {
  position: sticky;
  top: -18px;
  z-index: 25;
  background: rgba(7, 11, 22, 0.9);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-gold);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 26px;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
}

.jump-pill {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.2);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  transition: all 0.2s;
}
.jump-pill:hover {
  color: var(--accent-gold-light);
  border-color: var(--accent-gold);
  background: rgba(245, 158, 11, 0.12);
}

.story-hero-banner {
  background: 
    radial-gradient(circle at 12% 18%, rgba(245, 158, 11, 0.22) 0%, transparent 45%),
    radial-gradient(circle at 88% 82%, rgba(6, 182, 212, 0.18) 0%, transparent 50%),
    linear-gradient(145deg, rgba(15, 23, 42, 0.96) 0%, rgba(4, 6, 13, 0.98) 100%);
  border: 1px solid var(--border-gold);
  border-radius: 22px;
  padding: 42px 40px;
  margin-bottom: 28px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  position: relative;
  overflow: hidden;
}

/* Ornate Corner Accents */
.story-hero-banner::before {
  content: "";
  position: absolute;
  top: 12px; left: 12px;
  width: 28px; height: 28px;
  border-top: 2px solid var(--accent-gold);
  border-left: 2px solid var(--accent-gold);
  opacity: 0.7;
}
.story-hero-banner::after {
  content: "";
  position: absolute;
  bottom: 12px; right: 12px;
  width: 28px; height: 28px;
  border-bottom: 2px solid var(--accent-cyan);
  border-right: 2px solid var(--accent-cyan);
  opacity: 0.7;
}

.story-hero-tagline {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  letter-spacing: 2.5px;
  color: var(--accent-gold-light);
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.story-hero-title {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 900;
  line-height: 1.22;
  background: linear-gradient(120deg, #ffffff 0%, #fef08a 45%, var(--accent-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 18px;
}

.story-hero-lead {
  font-size: 1.06rem;
  color: var(--text-Prose);
  line-height: 1.85;
  max-width: 960px;
  margin-bottom: 24px;
}

.story-hero-chips {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* Manifesto Bento Grid (Why This Universe Slaps) */
.manifesto-bento {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}

.manifesto-card {
  background: linear-gradient(160deg, rgba(19, 28, 49, 0.85) 0%, rgba(8, 12, 24, 0.92) 100%);
  border: 1px solid var(--border-color);
  border-top: 2px solid var(--accent-gold);
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  transition: transform 0.22s ease, border-color 0.22s ease;
}
.manifesto-card:hover {
  transform: translateY(-3px);
  border-color: var(--accent-gold);
}
.manifesto-card.cyan-top { border-top-color: var(--accent-cyan); }
.manifesto-card.rose-top { border-top-color: var(--accent-rose); }
.manifesto-card.emerald-top { border-top-color: var(--accent-emerald); }

.mc-tag {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--accent-gold-light);
  margin-bottom: 6px;
  font-weight: 700;
}
.manifesto-card h4 {
  font-family: var(--font-display);
  font-size: 1.05rem;
  color: #fff;
  margin-bottom: 8px;
}
.manifesto-card p {
  font-size: 0.86rem;
  color: #cbd5e1;
  line-height: 1.62;
}

/* Act Cards */
.story-act-card {
  background: rgba(13, 20, 38, 0.78);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 34px 32px;
  margin-bottom: 28px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  transition: all 0.25s ease;
  position: relative;
}

.story-act-card:hover {
  border-color: rgba(245, 158, 11, 0.42);
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
}

.story-act-card.featured-gold {
  border-color: rgba(245, 158, 11, 0.38);
  background: linear-gradient(145deg, rgba(245, 158, 11, 0.08) 0%, rgba(11, 17, 32, 0.9) 55%);
}
.story-act-card.featured-cyan {
  border-color: rgba(6, 182, 212, 0.38);
  background: linear-gradient(145deg, rgba(6, 182, 212, 0.08) 0%, rgba(11, 17, 32, 0.9) 55%);
}
.story-act-card.featured-rose {
  border-color: rgba(244, 63, 94, 0.38);
  background: linear-gradient(145deg, rgba(244, 63, 94, 0.08) 0%, rgba(11, 17, 32, 0.9) 55%);
}
.story-act-card.featured-emerald {
  border-color: rgba(16, 185, 129, 0.38);
  background: linear-gradient(145deg, rgba(16, 185, 129, 0.08) 0%, rgba(11, 17, 32, 0.9) 55%);
}
.story-act-card.featured-purple {
  border-color: rgba(168, 85, 247, 0.38);
  background: linear-gradient(145deg, rgba(168, 85, 247, 0.08) 0%, rgba(11, 17, 32, 0.9) 55%);
}

.story-act-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.story-act-badge {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 5px 14px;
  border-radius: 20px;
  background: rgba(245, 158, 11, 0.18);
  color: var(--accent-gold-light);
  border: 1px solid var(--border-gold);
}
.story-act-badge.cyan { background: rgba(6, 182, 212, 0.18); color: var(--accent-cyan-light); border-color: var(--border-cyan); }
.story-act-badge.rose { background: rgba(244, 63, 94, 0.18); color: #fda4af; border-color: rgba(244, 63, 94, 0.4); }
.story-act-badge.emerald { background: rgba(16, 185, 129, 0.18); color: #34d399; border-color: rgba(16, 185, 129, 0.4); }
.story-act-badge.purple { background: rgba(168, 85, 247, 0.18); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.4); }

.story-act-title {
  font-family: var(--font-display);
  font-size: 1.56rem;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 16px;
  line-height: 1.35;
}

.story-prose {
  font-size: 1.01rem;
  line-height: 1.85;
  color: var(--text-Prose);
  margin-bottom: 16px;
}
.story-prose p { margin-bottom: 14px; }
.story-prose strong { color: #ffffff; font-weight: 700; }
.story-prose em { color: var(--accent-gold-light); font-style: normal; font-weight: 600; }

.story-callout {
  border-left: 4px solid var(--accent-gold);
  background: linear-gradient(90deg, rgba(245, 158, 11, 0.12) 0%, rgba(15, 23, 42, 0.5) 100%);
  padding: 18px 22px;
  border-radius: 0 12px 12px 0;
  margin: 20px 0;
  font-style: italic;
  color: #f8fafc;
  line-height: 1.75;
}
.story-callout strong { font-style: normal; color: var(--accent-gold-light); }

/* Deep-Link Action Footer inside Act Cards */
.act-deep-links {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px dashed rgba(148, 163, 184, 0.2);
}
.deep-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(245, 158, 11, 0.35);
  color: var(--accent-gold-light);
  font-family: var(--font-mono);
  font-size: 0.74rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.deep-link-btn:hover {
  background: var(--accent-gold);
  color: #050811;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(245, 158, 11, 0.3);
}

/* Shard Showcase Grid */
.shard-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 18px;
  margin: 24px 0;
}

.shard-card {
  background: rgba(8, 13, 26, 0.92);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 22px 20px;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
}
.shard-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent-gold);
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.55);
}

.shard-card-header {
  display: flex;
  align-items: center;
